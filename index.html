<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mesh Data — Scans collected by Mesh Utility App and mesh-utility.org</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{
font-family:system-ui,-apple-system,Segoe UI,Roboto;
background:#0f172a;
color:#e5e7eb;
margin:0;
padding:20px;
}

h1{margin-bottom:4px}

.subtitle{
color:#94a3b8;
margin-bottom:14px;
}

/* legend */

.legend{
display:flex;
flex-direction:column;
gap:6px;
background:#020617;
padding:12px;
border-radius:10px;
width:260px;
margin-bottom:16px;
}

.legend-item{
display:flex;
align-items:center;
gap:8px;
font-size:13px;
}

.legend small{
margin-left:auto;
color:#94a3b8;
}

.dot{
width:12px;
height:12px;
border-radius:3px;
display:inline-block;
}

.excellent-dot{background:#22c55e}
.good-dot{background:#4ade80}
.fair-dot{background:#facc15}
.marginal-dot{background:#fb923c}
.poor-dot{background:#ef4444}

/* row colors */

tr.excellent{
background:rgba(34,197,94,0.15);
}

tr.good{
background:rgba(74,222,128,0.12);
}

tr.fair{
background:rgba(250,204,21,0.10);
}

tr.marginal{
background:rgba(251,146,60,0.10);
}

tr.poor{
background:rgba(239,68,68,0.12);
}

/* controls */

.controls{
display:flex;
flex-wrap:wrap;
gap:12px;
margin-bottom:14px;
align-items:flex-start;
}

input,select,button{
padding:8px;
border-radius:8px;
border:none;
background:#1e293b;
color:white;
font-size:13px;
}

button{
background:#3b82f6;
cursor:pointer;
}

/* node multi-select */

.filter-box{
display:flex;
flex-direction:column;
gap:4px;
}

.multi-list{
background:#020617;
border-radius:8px;
padding:6px;
height:140px;
overflow:auto;
min-width:200px;
border:1px solid #1f2937;
}

.node-option{
display:flex;
align-items:center;
gap:6px;
font-size:12px;
padding:3px;
}

.node-option:hover{
background:#0f172a;
}

/* table */

.container{
height:70vh;
overflow:auto;
background:#020617;
border-radius:10px;
}

table{
border-collapse:collapse;
width:100%;
}

th,td{
padding:6px 10px;
border-bottom:1px solid #1f2937;
font-size:12px;
white-space:nowrap;
}

thead{
background:#1e293b;
position:sticky;
top:0;
}

/* stats */

.stats{
margin-top:10px;
color:#94a3b8;
font-size:12px;
}

</style>
</head>

<body>

<h1>Mesh Data</h1>
<div class="subtitle">
Scans collected by Mesh Utility App and mesh-utility.org
</div>

<div class="legend">

<div class="legend-item">
<span class="dot excellent-dot"></span>
Excellent <small>RSSI > -90, SNR > 10</small>
</div>

<div class="legend-item">
<span class="dot good-dot"></span>
Good <small>RSSI > -100, SNR > 0</small>
</div>

<div class="legend-item">
<span class="dot fair-dot"></span>
Fair <small>RSSI > -110, SNR > -7</small>
</div>

<div class="legend-item">
<span class="dot marginal-dot"></span>
Marginal <small>RSSI > -115, SNR > -13</small>
</div>

<div class="legend-item">
<span class="dot poor-dot"></span>
Poor <small>Weak signal</small>
</div>

</div>

<div class="controls">

<input id="search" placeholder="Search">

<label>Start</label>
<input type="date" id="startDate">

<label>End</label>
<input type="date" id="endDate">

<div class="filter-box">
<label>Search Nodes</label>
<input id="nodeSearch" placeholder="Search nodes">
<div id="nodeList" class="multi-list"></div>
</div>

<div class="filter-box">
<label>Observers</label>
<select id="observerFilter" multiple size="6"></select>
</div>

<button onclick="applyFilters()">Filter</button>
<button onclick="downloadFiltered()">Download Filtered</button>

</div>

<div class="container" id="scrollContainer">

<table id="table">
<thead></thead>
<tbody></tbody>
</table>

</div>

<div class="stats">
Rows Loaded: <span id="loadedCount">0</span><br>
Filtered Rows: <span id="filteredCount">0</span>
</div>

<script>

let headers=[]
let allRows=[]
let filtered=[]

let nodeSet=new Set()
let observerSet=new Set()

let visibleStart=0
let visibleCount=200
let rowHeight=26

const container=document.getElementById("scrollContainer")
const tbody=document.querySelector("#table tbody")
const thead=document.querySelector("#table thead")

function classifySignal(rssi,snr){

rssi=parseFloat(rssi)
snr=parseFloat(snr)

if(rssi>-90 && snr>10) return "excellent"
if(rssi>-100 && snr>0) return "good"
if(rssi>-110 && snr>-7) return "fair"
if(rssi>-115 && snr>-13) return "marginal"

return "poor"
}

/* CSV streaming */

async function loadCSV(){

const response=await fetch("./scans.csv")

const reader=response.body.getReader()
const decoder=new TextDecoder()

let buffer=""
let firstRow=true

while(true){

const {value,done}=await reader.read()
if(done) break

buffer+=decoder.decode(value,{stream:true})

let lines=buffer.split("\n")
buffer=lines.pop()

for(const line of lines){

if(!line.trim()) continue

const row=line.split(",")

if(firstRow){

headers=row
renderHeader()
firstRow=false
continue
}

let obj={}
headers.forEach((h,i)=>obj[h]=row[i]||"")

allRows.push(obj)

if(obj.nodeName) nodeSet.add(obj.nodeName)
if(obj.observerName) observerSet.add(obj.observerName)

document.getElementById("loadedCount").innerText=allRows.length
}

}

populateNodeList()
populateObservers()

filtered=[...allRows]
document.getElementById("filteredCount").innerText=filtered.length

renderVisible()
}

function renderHeader(){

const tr=document.createElement("tr")

headers.forEach(h=>{
const th=document.createElement("th")
th.textContent=h
tr.appendChild(th)
})

thead.appendChild(tr)
}

function populateNodeList(){

const list=document.getElementById("nodeList")

Array.from(nodeSet).sort().forEach(node=>{

const div=document.createElement("div")
div.className="node-option"

div.innerHTML=
`<input type="checkbox" value="${node}">
<span>${node}</span>`

list.appendChild(div)
})
}

function populateObservers(){

const select=document.getElementById("observerFilter")

Array.from(observerSet).sort().forEach(o=>{

const option=document.createElement("option")
option.value=o
option.textContent=o

select.appendChild(option)
})
}

document.getElementById("nodeSearch").addEventListener("input",function(){

const q=this.value.toLowerCase()

document.querySelectorAll("#nodeList .node-option").forEach(el=>{

const name=el.innerText.toLowerCase()

el.style.display=name.includes(q)?"flex":"none"

})
})

function renderVisible(){

tbody.innerHTML=""

const end=Math.min(visibleStart+visibleCount,filtered.length)

for(let i=visibleStart;i<end;i++){

const row=filtered[i]
const tr=document.createElement("tr")

const quality=classifySignal(row.rssi,row.snr)
tr.className=quality

headers.forEach(h=>{

const td=document.createElement("td")
td.textContent=row[h]
tr.appendChild(td)

})

tbody.appendChild(tr)
}
}

container.addEventListener("scroll",()=>{

visibleStart=Math.floor(container.scrollTop/rowHeight)
renderVisible()

})

function applyFilters(){

const search=document.getElementById("search").value.toLowerCase()
const start=document.getElementById("startDate").value
const end=document.getElementById("endDate").value

const nodes=Array.from(document.querySelectorAll("#nodeList input:checked")).map(x=>x.value)

const observers=Array.from(
document.getElementById("observerFilter").selectedOptions
).map(o=>o.value)

filtered=allRows.filter(r=>{

if(search){
if(!Object.values(r).join(" ").toLowerCase().includes(search))
return false
}

if(start || end){

let d=new Date(r.datetime_utc)

if(start && d < new Date(start)) return false
if(end && d > new Date(end+"T23:59:59")) return false
}

if(nodes.length && !nodes.includes(r.nodeName)) return false
if(observers.length && !observers.includes(r.observerName)) return false

return true
})

visibleStart=0
document.getElementById("filteredCount").innerText=filtered.length
renderVisible()
}

function downloadFiltered(){

let csv=headers.join(",")+"\n"

filtered.forEach(r=>{
csv+=headers.map(h=>r[h]).join(",")+"\n"
})

const blob=new Blob([csv],{type:"text/csv"})
const url=URL.createObjectURL(blob)

const a=document.createElement("a")
a.href=url
a.download="filtered_mesh_scans.csv"
a.click()
}

loadCSV()

</script>

</body>
</html>
