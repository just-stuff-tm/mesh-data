<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Mesh Data — Scans collected by Mesh Utility App and mesh-utility.org</title>

<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{
font-family:system-ui,-apple-system,Segoe UI,Roboto;
background:#0f172a;
color:#e5e7eb;
margin:0;
padding:20px;
}

h1{margin-bottom:5px}

.subtitle{
color:#94a3b8;
margin-bottom:15px;
}

.controls{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:10px;
}

input,button{
padding:8px;
border-radius:8px;
border:none;
background:#1e293b;
color:white;
}

button{
background:#3b82f6;
cursor:pointer;
}

.container{
height:70vh;
overflow:auto;
background:#020617;
border-radius:10px;
}

table{
border-collapse:collapse;
width:100%;
}

th,td{
padding:6px 10px;
border-bottom:1px solid #1f2937;
font-size:12px;
}

thead{
background:#1e293b;
position:sticky;
top:0;
}

tr:hover{
background:#0f172a;
}

.good{color:#22c55e}
.bad{color:#ef4444}

.stats{
margin-top:10px;
color:#94a3b8;
font-size:12px;
}

</style>
</head>

<body>

<h1>Mesh Data</h1>

<div class="subtitle">
Scans collected by Mesh Utility App and mesh-utility.org
</div>

<div class="controls">

<input id="search" placeholder="Search">

<label>Start</label>
<input type="date" id="startDate">

<label>End</label>
<input type="date" id="endDate">

<button onclick="applyFilters()">Filter</button>

<button onclick="downloadFiltered()">Download Filtered</button>

</div>

<div class="container" id="scrollContainer">

<table id="table">
<thead></thead>
<tbody></tbody>
</table>

</div>

<div class="stats">
Rows Loaded: <span id="loadedCount">0</span>
</div>

<script>

let headers=[]
let allRows=[]
let filtered=[]

let visibleStart=0
let visibleCount=200
let rowHeight=26

const container=document.getElementById("scrollContainer")
const tbody=document.querySelector("#table tbody")
const thead=document.querySelector("#table thead")

/* STREAM CSV SAFELY */

async function loadCSV(){

const response=await fetch("./scans.csv")

if(!response.ok){
console.error("CSV failed to load")
return
}

const reader=response.body.getReader()
const decoder=new TextDecoder()

let buffer=""
let firstRow=true

while(true){

const {value,done}=await reader.read()

if(done) break

buffer+=decoder.decode(value,{stream:true})

let lines=buffer.split("\n")

buffer=lines.pop()

for(const line of lines){

if(!line.trim()) continue

const row=line.split(",")

if(firstRow){

headers=row
renderHeader()

firstRow=false
continue

}

let obj={}

headers.forEach((h,i)=>obj[h]=row[i]||"")

allRows.push(obj)

document.getElementById("loadedCount").innerText=allRows.length

}

}

filtered=[...allRows]

renderVisible()

}

/* HEADER */

function renderHeader(){

const tr=document.createElement("tr")

headers.forEach(h=>{

const th=document.createElement("th")

th.textContent=h

tr.appendChild(th)

})

thead.appendChild(tr)

}

/* VIRTUALIZED TABLE */

function renderVisible(){

tbody.innerHTML=""

const end=Math.min(visibleStart+visibleCount,filtered.length)

for(let i=visibleStart;i<end;i++){

const row=filtered[i]

const tr=document.createElement("tr")

headers.forEach(h=>{

const td=document.createElement("td")

let val=row[h]

if(h==="rssi"){

let n=parseFloat(val)

if(!isNaN(n)){
td.className=n>-80?"good":"bad"
}

}

td.textContent=val

tr.appendChild(td)

})

tbody.appendChild(tr)

}

}

/* SCROLL LAZY RENDER */

container.addEventListener("scroll",()=>{

const scrollTop=container.scrollTop

visibleStart=Math.floor(scrollTop/rowHeight)

renderVisible()

})

/* FILTERING */

function applyFilters(){

const search=document.getElementById("search").value.toLowerCase()

const start=document.getElementById("startDate").value
const end=document.getElementById("endDate").value

filtered=allRows.filter(r=>{

if(search){

if(!Object.values(r).join(" ").toLowerCase().includes(search))
return false

}

if(start || end){

let d=new Date(r.datetime_utc)

if(start && d < new Date(start)) return false

if(end && d > new Date(end+"T23:59:59")) return false

}

return true

})

visibleStart=0

renderVisible()

}

/* EXPORT FILTERED */

function downloadFiltered(){

let csv=headers.join(",")+"\n"

filtered.forEach(r=>{

csv+=headers.map(h=>r[h]).join(",")+"\n"

})

const blob=new Blob([csv],{type:"text/csv"})

const url=URL.createObjectURL(blob)

const a=document.createElement("a")

a.href=url

a.download="filtered_mesh_scans.csv"

a.click()

}

/* START */

loadCSV()

</script>

</body>
</html>
